name: Build and deploy on ec2

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_IMAGE }}:latest .

    - name: Push Docker image to Docker Hub
      run: docker push ${{ secrets.DOCKER_IMAGE }}:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop portfolio-container || true
          docker rm portfolio-container || true
          docker pull ${{ secrets.DOCKER_IMAGE }}:latest
          docker run -d --rm --name portfolio-container -p 80:80 ${{ secrets.DOCKER_IMAGE }}:latest
